name: Build and verify installers
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      [
        "desktop/**",
        "scripts/*release*",
        "scripts/after-pack.cjs",
        "scripts/install-linux.sh",
        "package*.json",
        ".github/workflows/release.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the Linux sandbox prerequisite
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --retry 3 https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o "$RUNNER_TEMP/chrome.deb"
          sudo apt-get update -qq
          sudo apt-get install -y "$RUNNER_TEMP/chrome.deb"
      - run: npm test
      - name: Verify release version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e 'if ("v" + require("./package.json").version !== process.env.GITHUB_REF_NAME) process.exit(1)'
      - run: npm run package:linux
        if: runner.os == 'Linux'
      - name: Exercise Linux AppImage
        if: runner.os == 'Linux'
        run: |
          chmod +x release/*.AppImage
          xvfb-run -a node scripts/release-check.mjs release/*.AppImage
      - run: npm run package:windows
        if: runner.os == 'Windows'
      - name: Install and exercise Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release/*Setup*.exe).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'ddd-installed'
          $process = Start-Process $installer -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          node scripts/release-check.mjs "$destination/Deep Dark Dungeons - HoL.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*Setup*.exe
            release/*.blockmap
            release/latest*.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ runner.os }}
          path: test-results/release-*.png
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release
      - name: Publish the complete, verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp scripts/install-linux.sh public/art/greyhaven-seal.png release/
          cd release
          sha256sum *.AppImage *.exe *.blockmap *.yml *.sh *.png > SHA256SUMS
          tar -czf "Deep-Dark-Dungeons-HoL-${GITHUB_REF_NAME#v}-linux-x64.tar.gz" ./*.AppImage install-linux.sh greyhaven-seal.png SHA256SUMS
          sha256sum *.tar.gz >> SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Deep Dark Dungeons - HoL $GITHUB_REF_NAME" --notes-file ../docs/release-notes.md
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" ./*
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
